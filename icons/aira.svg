<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#311B92;stop-opacity:1" /> <!-- Deep Indigo -->
      <stop offset="100%" style="stop-color:#1A0B2E;stop-opacity:1" /> <!-- Almost Black -->
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFD700" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Side Profile Owl -->
  <g filter="url(#softGlow)">
    <!-- Main Body Shape -->
    <!-- Head (Ear tuft), Back curve, Tail feather, Belly, Feet -->
    <path d="M24 12 
             L28 18 
             C36 18, 44 24, 46 32 
             C48 40, 46 48, 42 54 
             L38 58 
             L34 54 
             C24 52, 18 44, 18 34 
             C18 26, 20 20, 24 12 Z" 
          fill="url(#body)" stroke="#FFD700" stroke-width="2" stroke-linejoin="round" />
          
    <!-- Wing (Folded) -->
    <path d="M28 28 C36 28, 40 36, 38 48" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.8" />
    
    <!-- Eye (Side View) -->
    <circle cx="26" cy="24" r="2" fill="#FFD700" />
    
    <!-- Beak -->
    <path d="M18 26 L14 28 L18 30" fill="#FFD700" />
  </g>
</svg>